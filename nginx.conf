server {
    listen 80;
    server_name luisacorralcoach.com;
    return 301 https://www.luisacorralcoach.com$request_uri;
}

server {
    listen 80 default_server;
    server_name www.luisacorralcoach.com;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;

    # Compresión (el HTML pesa ~140 KB sin comprimir)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/ld+json application/javascript text/javascript application/xml image/svg+xml;

    # Eliminar trailing slash (excepto root) → canonical sin slash
    rewrite ^(.+)/$ $1 permanent;

    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # Bloquear archivos internos (por si llegaran al contenedor)
    location ~ /\.(?!well-known) { return 404; }
    location ~* \.(md|mjs|lock|ya?ml|env|map|bak|orig|log)$ { return 404; }
    location ~* ^/(scripts|node_modules|\.git|\.claude)(/|$) { return 404; }
    location = /assets/image-manifest.json { return 404; }

    location = /retiros-espirituales-galicia {
        return 301 /retiros-espirituales;
    }

    # Consolidado en /blog/que-es-coach-holistico: contenido casi duplicado que canibalizaba el mismo término
    location = /blog/coaching-holistico-beneficios-enfoque-integral {
        return 301 /blog/que-es-coach-holistico;
    }
    location = /blog/en-que-me-puede-ayudar-un-coach-holistico {
        return 301 /blog/que-es-coach-holistico;
    }

    location ~* ^/(que-es-coach-holistico|en-que-me-puede-ayudar-un-coach-holistico|tecnicas-mindfulness-reducir-estres|que-es-coaching-angelical|reiki-delfin-sanacion-energia-delfines|encontrar-proposito-vida-40|que-son-las-flores-de-bach|coaching-holistico-beneficios-enfoque-integral|flores-de-bach-para-la-ansiedad)/?$ {
        return 301 /blog/$1;
    }

    # Consolidado: las 85 páginas de zona (5 servicios x 17 regiones) se
    # fusionan en 17 páginas por comunidad autónoma con los 5 servicios
    # integrados, para evitar el patrón de doorway pages detectado en la
    # auditoría de Search Console (76% de las páginas de zona con 0 clics
    # en 3 meses).
    location ~ ^/(coaching-angelical|coaching-holistico|flores-de-bach|reiki-delfin|meditaciones-personalizadas)/en-(andalucia|aragon|asturias|baleares|canarias|cantabria|castilla-la-mancha|castilla-y-leon|cataluna|comunidad-de-madrid|comunidad-valenciana|extremadura|galicia|la-rioja|navarra|pais-vasco|region-de-murcia)/?$ {
        return 301 /en-$2;
    }

    if ($request_uri ~ ^/index\.html?$) {
        return 301 /;
    }
    if ($request_uri ~ ^(.+)/index\.html?$) {
        return 301 $1;
    }

    error_page 404 =404 /404.html;

    location = /404.html {
        internal;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri.html $uri/index.html =404;
    }
}
