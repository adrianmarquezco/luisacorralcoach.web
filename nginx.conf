server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;

    # Compresión (el HTML pesa ~140 KB sin comprimir)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/ld+json application/javascript text/javascript application/xml image/svg+xml;

    # Eliminar trailing slash (excepto root) → canonical sin slash
    rewrite ^(.+)/$ $1 permanent;

    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    location = /retiros-espirituales-galicia {
        return 301 /retiros-espirituales;
    }

    location ~* ^/(que-es-coach-holistico|en-que-me-puede-ayudar-un-coach-holistico|tecnicas-mindfulness-reducir-estres|que-es-coaching-angelical|reiki-delfin-sanacion-energia-delfines|encontrar-proposito-vida-40|que-son-las-flores-de-bach|coaching-holistico-beneficios-enfoque-integral|flores-de-bach-para-la-ansiedad)/?$ {
        return 301 /blog/$1;
    }

    if ($request_uri ~ ^/index\.html?$) {
        return 301 /;
    }
    if ($request_uri ~ ^(.+)/index\.html?$) {
        return 301 $1;
    }

    error_page 404 =404 /404.html;

    location = /404.html {
        internal;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri.html $uri/index.html =404;
    }
}
