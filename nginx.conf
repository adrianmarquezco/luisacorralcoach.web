server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # Duplicado SEO: solo versión blog
    location = /que-es-coach-holistico {
        return 301 /blog/que-es-coach-holistico;
    }

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
