# Redirect www → non-www
# Coolify pasa el Host header original al container, nginx lo distingue con server_name
server {
    listen 80;
    server_name www.luisacorralcoach.com;
    return 301 https://luisacorralcoach.com$request_uri;
}

server {
    listen 80;
    server_name luisacorralcoach.com _;
    root /usr/share/nginx/html;
    index index.html;

    # absolute_redirect off: los redirects de trailing-slash usan URLs relativas
    # (solo el path, sin scheme), así el browser mantiene https:// en lugar de
    # generar Location: http:// cuando Coolify ha terminado TLS antes de llegar aquí
    absolute_redirect off;
    port_in_redirect off;

    # Imágenes y fuentes: caché inmutable 1 año
    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # CSS/JS: sin caché (fuerza revalidación)
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # Redirects legacy: posts de blog indexados sin el prefijo /blog/
    location ~* ^/(que-es-coach-holistico|en-que-me-puede-ayudar-un-coach-holistico|tecnicas-mindfulness-reducir-estres|que-es-coaching-angelical|reiki-delfin-sanacion-energia-delfines|encontrar-proposito-vida-40|que-son-las-flores-de-bach|coaching-holistico-beneficios-enfoque-integral|flores-de-bach-para-la-ansiedad)/?$ {
        return 301 /blog/$1;
    }

    # Strip index.html de las URLs
    if ($request_uri ~ ^/index\.html?$) {
        return 301 /;
    }
    if ($request_uri ~ ^(.+)/index\.html?$) {
        return 301 $1/;
    }

    error_page 404 =404 /404.html;

    location = /404.html {
        internal;
    }

    location / {
        # Headers de seguridad en todas las respuestas HTML
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-cache, must-revalidate" always;

        try_files $uri $uri/index.html $uri.html =404;
    }
}
